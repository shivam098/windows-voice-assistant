name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test tests/VoiceAssistant.Core.Tests -c Release
      - name: Idea board tests
        run: dotnet test tests/VoiceAssistant.Board.Tests -c Release

      - name: Build app (x64)
        run: dotnet build src/VoiceAssistant.App -c Release -r win-x64

      - name: Build app (ARM64)
        run: dotnet build src/VoiceAssistant.App -c Release -r win-arm64
