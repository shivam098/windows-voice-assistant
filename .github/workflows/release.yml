name: Release

# Builds the portable zips on a clean Windows runner, bundling the Visual C++ runtime from the runner's
# Visual Studio installation, and attaches them to the GitHub release for the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (e.g. v0.3.1)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: dotnet test tests/VoiceAssistant.Core.Tests -c Release

      - name: Package x64 and ARM64 zips (with Visual C++ runtime)
        shell: pwsh
        run: ./scripts/package.ps1 -RequireVcRuntime

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/*.zip | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name } |
            Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voice-assistant-zips
          path: dist/*

      - name: Attach to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "Voice Assistant $tag" --generate-notes }
          gh release upload $tag (Get-ChildItem dist/*.zip).FullName dist/SHA256SUMS.txt --clobber
